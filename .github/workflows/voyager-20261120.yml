name: Voyager 1 light-day assets (NASA public domain)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/voyager-20261120.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch NASA SVS clips and JPL stills
        shell: bash
        run: |
          set -u
          mkdir -p out && cd out
          B="https://svs.gsfc.nasa.gov/vis/a010000/a015100/a015120"
          for f in 15120_VoyagerBeauty_S01_1080.mp4 15120_VoyagerBeauty_S02_1080.mp4 15120_VoyagerBeauty_S03_1080.mp4 \
                   15120_VoyagerBeauty_S04_1080.mp4 15120_VoyagerBeauty_S05_1080.mp4 \
                   15120_VoyagerLightDay_01_Launch_from_Earth_clean_1080.mp4 15120_VoyagerLightDay_02_Orbit_Exit_1080.mp4 \
                   15120_VoyagerLightDay_03_Earth_to_Moon_to_Neptune_WithVoyager_1080.mp4 15120_VoyagerLightDay_Extra_Voyager_360_1080.mp4; do
            curl -fsSL --retry 2 -o "$f" "$B/$f" || echo "MISSING $f"
          done
          curl -fsSL --retry 2 -o "1LD_KeyArt.jpeg" "$B/1LD%20Key%20Art_Orientation%203.jpeg" || echo "MISSING keyart"
          curl -fsSL --retry 2 -o PIA23645_PaleBlueDot.jpg https://photojournal.jpl.nasa.gov/jpeg/PIA23645.jpg || echo "MISSING PIA23645"
          curl -fsSL --retry 2 -o PIA21746_Voyager1_Launch.jpg https://photojournal.jpl.nasa.gov/jpeg/PIA21746.jpg || echo "MISSING PIA21746"
          ls -la
      - name: Commit to assets branch
        shell: bash
        run: |
          set -eu
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Voyager 1 light-day assets, NASA/JPL-Caltech public domain [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/assets/voyager-2026-11-20
