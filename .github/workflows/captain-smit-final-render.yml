name: Captain Smit final SightSaga reel

on:
  push:
    paths:
      - ".github/workflows/captain-smit-final-render.yml"
      - "batches/captain-smit-final-render-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media tools
        run: |
          python -m pip install -q yt-dlp pillow
          mkdir -p "$HOME/ffmpeg-bin"
          curl -fL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ffmpeg.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          FFDIR=$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-*-amd64-static' | head -1)
          cp "$FFDIR/ffmpeg" "$FFDIR/ffprobe" "$HOME/ffmpeg-bin/"
          chmod +x "$HOME/ffmpeg-bin/ffmpeg" "$HOME/ffmpeg-bin/ffprobe"
          echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"

      - name: Download authentic source footage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src work out text
          yt-dlp --no-playlist -f "best[ext=mp4]/best" -o "src/smit.%(ext)s" "https://t.co/S28KLeDsv4"
          yt-dlp --no-playlist -f "best[ext=mp4]/best" -o "src/dive.%(ext)s" "https://t.co/wtiqBYhEw1"
          yt-dlp --no-playlist -f "best[ext=mp4]/best" -o "src/trump.%(ext)s" "https://t.co/zNDHbbEs6f"
          yt-dlp --no-playlist -f "best[ext=mp4]/best" -o "src/modi.%(ext)s" "https://x.com/narendramodi/status/2105553094004379938"
          yt-dlp --no-playlist -f "best[ext=mp4]/best" -o "src/rescue.%(ext)s" "https://x.com/GLZRadio/status/2105323964684030088"
          yt-dlp --no-playlist -f "best[ext=mp4]/best" -o "src/netanyahu.%(ext)s" "https://t.co/55AgmAvzIG" ||             yt-dlp --no-playlist --download-sections "*0-25" -f "best[ext=mp4]/best" -o "src/netanyahu.%(ext)s" "https://www.foxnews.com/media/netanyahu-praises-heroic-bystander-bloody-cockpit-attack-preventing-another-9-11"
          ls -lh src/

      - name: Download narration and sound design
        shell: bash
        run: |
          curl -fL 'https://storage.googleapis.com/xi-backend/database/workspace/b8d6c7361e7a4cfd924285cd6d01fb56/content_generation/rjk5uswZVdeY44m0bKho/o8wjeYlyfzG2ouyMquXE/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261001%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261001T211320Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-' -o work/bunty.mp3
          curl -fL 'https://storage.googleapis.com/xi-backend/database/workspace/b8d6c7361e7a4cfd924285cd6d01fb56/content_generation/GbHvzQpCtuyoId9bxJDx/qKgmBaLSam5orQCALVlF/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261001%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261001T210657Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-' -o work/music.mp3
          curl -fL 'https://storage.googleapis.com/xi-backend/database/workspace/b8d6c7361e7a4cfd924285cd6d01fb56/content_generation/RtlFXkMqRuWZwfo1Zz1H/qSaeE4K733hujUtCpxsG/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261001%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261001T210955Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-' -o work/click.mp3
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 work/bunty.mp3
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 work/music.mp3

      - name: Build SightSaga edit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out

          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          W,H = 1080,1920
          NAVY=(6,26,45,255)
          ORANGE=(255,101,0,255)
          WHITE=(255,255,255,255)
          GREY=(214,222,229,255)
          BOLD="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          REG="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          Path("work").mkdir(exist_ok=True)

          def font(path,size): return ImageFont.truetype(path,size)
          def center(draw, text, y, fnt, fill, spacing=14):
              draw.multiline_text((W//2,y), text, font=fnt, fill=fill, anchor="ma", align="center", spacing=spacing)

          def overlay(name,title,subtitle):
              im=Image.new("RGBA",(W,H),(0,0,0,0))
              d=ImageDraw.Draw(im)
              d.rectangle((0,1150,W,H), fill=NAVY)
              d.rectangle((0,1150,W,1158), fill=ORANGE)
              tf=font(BOLD, 43 if len(title)>31 else 54)
              sf=font(REG, 37 if len(subtitle)>45 else 42)
              center(d,title,1225,tf,ORANGE)
              center(d,subtitle,1335,sf,WHITE,18)
              lf=font(BOLD,32)
              label="SIGHTSAGA"
              box=d.textbbox((0,0),label,font=lf)
              tw=box[2]-box[0]; th=box[3]-box[1]
              d.rounded_rectangle((W-tw-66,26,W-20,26+th+28), radius=10, fill=(6,26,45,165))
              d.text((W-43,40),label,font=lf,fill=WHITE,anchor="ra")
              im.save(f"work/{name}.png")

          cards={
            "ov1":("BEFORE THE INCIDENT • 2025","CAPTAIN SMIT MACHCHHAR\nA PILOT TALKING ABOUT SAFETY"),
            "ov2":("FLYDUBAI FZ1073","DUBAI → TEL AVIV\n30 SEPTEMBER 2026"),
            "ov3":("THE AIRCRAFT DROPS RAPIDLY","~14,000 FT IN UNDER 30 SEC\nREUTERS / FLIGHTRADAR24"),
            "ov5":("THE DOOR OPENS","PASSENGERS + CREW CAN REACH THE COCKPIT"),
            "ov6":("CONTROL REGAINED","RELIEF PILOTS DIVERT TO TABUK, SAUDI ARABIA"),
            "ov7":("INDIA • PM NARENDRA MODI","“HIGHEST FORM OF COURAGE.”"),
            "ov8":("ISRAEL • PM BENJAMIN NETANYAHU","“HE IS A TRUE HERO.”"),
            "ov9":("UNITED STATES • PRESIDENT DONALD TRUMP","“IN A WAY, HE WAS A HERO.”"),
            "ov10":("THE FLIGHT SURVIVES","PASSENGERS FINALLY HEAD HOME"),
            "ov11":("THE PRAISE CAME LATER","THE DECISIVE MOMENT CAME IN THE COCKPIT"),
          }
          for n,(t,s) in cards.items(): overlay(n,t,s)

          # Clearly labelled reconstruction card
          im=Image.new("RGBA",(W,H),NAVY)
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((240,190,840,1110),radius=24,outline=(255,255,255,180),width=8)
          d.rectangle((770,625,816,775),fill=ORANGE)
          d.rounded_rectangle((742,642,844,756),radius=14,outline=(255,101,0,160),width=5)
          center(d,"INJURED. STILL THINKING.",1200,font(BOLD,58),WHITE)
          center(d,"COCKPIT DOOR RELEASE",1310,font(BOLD,52),ORANGE)
          center(d,"VISUAL RECONSTRUCTION",1418,font(REG,34),GREY)
          center(d,"CLICK",1540,font(BOLD,74),WHITE)
          d.text((W-43,40),"SIGHTSAGA",font=font(BOLD,32),fill=WHITE,anchor="ra")
          im.save("work/recon.png")

          # End card
          im=Image.new("RGBA",(W,H),NAVY)
          d=ImageDraw.Draw(im)
          center(d,"CAPTAIN SMIT MACHCHHAR",650,font(BOLD,66),WHITE)
          center(d,"COURAGE • DUTY • PRESENCE OF MIND",760,font(BOLD,38),GREY)
          d.rectangle((260,855,820,862),fill=ORANGE)
          center(d,"SIGHTSAGA SALUTES YOU",910,font(BOLD,50),ORANGE)
          center(d,"SIGHTSAGA",1070,font(BOLD,36),WHITE)
          im.save("work/end.png")
          PY

          make_seg () {
            in="$1"; start="$2"; dur="$3"; ov="$4"; out="$5"
            ffmpeg -y -ss "$start" -i "$in" -loop 1 -framerate 30 -i "$ov" -t "$dur"               -filter_complex "[0:v]scale=1080:1150:force_original_aspect_ratio=increase,crop=1080:1150,pad=1080:1920:0:0:color=0x061A2D[v];[v][1:v]overlay=0:0:format=auto"               -an -r 30 -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p "$out"
          }

          make_seg src/smit.mp4 0 6 work/ov1.png work/01.mp4
          make_seg src/dive.mp4 0 7 work/ov2.png work/02.mp4
          make_seg src/dive.mp4 10 9 work/ov3.png work/03.mp4

          ffmpeg -y -loop 1 -framerate 30 -i work/recon.png -t 6 -an             -r 30 -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p work/04.mp4

          make_seg src/dive.mp4 28 8 work/ov5.png work/05.mp4
          make_seg src/rescue.mp4 0 5 work/ov6.png work/06.mp4
          make_seg src/modi.mp4 0 3 work/ov7.png work/07.mp4
          make_seg src/netanyahu.mp4 0 3 work/ov8.png work/08.mp4
          make_seg src/trump.mp4 0 3 work/ov9.png work/09.mp4
          make_seg src/rescue.mp4 8 6 work/ov10.png work/10.mp4
          make_seg src/smit.mp4 8 10 work/ov11.png work/11.mp4

          ffmpeg -y -loop 1 -framerate 30 -i work/end.png -t 4 -an             -r 30 -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p work/12.mp4

          printf "file '%s'\n" 01.mp4 02.mp4 03.mp4 04.mp4 05.mp4 06.mp4 07.mp4 08.mp4 09.mp4 10.mp4 11.mp4 12.mp4 > work/concat.txt
          ffmpeg -y -f concat -safe 0 -i work/concat.txt -c copy work/video_silent.mp4

          # Preserve a short piece of Smit's authentic interview voice at the opening.
          ffmpeg -y -i src/smit.mp4 -t 4 -vn -c:a aac -b:a 160k work/smit_open.m4a

          ffmpeg -y -i work/video_silent.mp4 -i work/smit_open.m4a -i work/bunty.mp3 -i work/music.mp3 -i work/click.mp3             -filter_complex "[0:v]null[v];[1:a]atrim=0:4,volume=1.0[orig];[2:a]adelay=4000|4000,volume=1.10[vo];[3:a]atrim=0:70,afade=t=in:st=0:d=1,afade=t=out:st=68:d=2,volume='if(between(t,22,28),0.018,0.085)':eval=frame[mus];[4:a]atrim=0:0.8,adelay=25200|25200,volume=1.6[clk];[orig][vo][mus][clk]amix=inputs=4:duration=longest:dropout_transition=0,alimiter=limit=0.95[a]"             -map "[v]" -map "[a]" -t 70 -c:v copy -c:a aac -b:a 192k -movflags +faststart out/Captain_Smit_SightSaga_Hero_Reel.mp4

          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/Captain_Smit_SightSaga_Hero_Reel.mp4

      - name: Upload final reel
        uses: actions/upload-artifact@v4
        with:
          name: captain-smit-sightsaga-final
          path: out/Captain_Smit_SightSaga_Hero_Reel.mp4
          if-no-files-found: error
          retention-days: 7
