name: TBM explainer assets 2026-10-22
on:
  push:
    paths: ['.github/workflows/tbm-assets-20261022.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -U yt-dlp
      - name: Download source videos
        run: |
          mkdir -p assets
          yt-dlp --ignore-errors --no-playlist --socket-timeout 20 --retries 2 --max-filesize 80M -f 'bv*[height<=720]+ba/b[height<=720]' --merge-output-format mp4 --write-info-json -o 'assets/%(id)s.%(ext)s' 'https://www.youtube.com/watch?v=OZGRvFVJnOc' 'https://www.youtube.com/watch?v=L4I2Lf4YLBw' 'https://www.youtube.com/watch?v=HvwxlmYB2-4' 'https://www.youtube.com/watch?v=Of7PW_Ktmcs' 'https://x.com/OpIndia_com/status/1850567501341479401'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tbm-source-assets
          path: assets/
          retention-days: 7
          compression-level: 0
