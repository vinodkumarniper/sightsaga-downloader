name: Captain Smit footage download test

on:
  push:
    paths:
      - ".github/workflows/captain-smit-download-test.yml"
      - "batches/captain-smit-download-test-2026-10-02.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    if: github.event.head_commit.message != 'Remove Captain Smit download test workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install package
        run: python -m pip install .

      - name: Download selected Captain Smit footage
        run: |
          sightsaga-download             --url-file batches/captain-smit-download-test-2026-10-02.txt             --output-dir downloads             --max-downloads 4

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captain-smit-download-test-${{ github.run_number }}
          path: downloads/
          if-no-files-found: warn
          retention-days: 7
