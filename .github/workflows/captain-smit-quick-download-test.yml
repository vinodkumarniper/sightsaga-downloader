name: Captain Smit footage quick download test

on:
  push:
    paths:
      - ".github/workflows/captain-smit-quick-download-test.yml"
      - "batches/captain-smit-x-test-2026-10-02.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install .

      - name: Download selected Captain Smit X footage
        run: |
          sightsaga-download \
            --url-file batches/captain-smit-x-test-2026-10-02.txt \
            --output-dir downloads \
            --max-downloads 2 \
            --format "best[ext=mp4]/best"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captain-smit-x-download-test-${{ github.run_number }}
          path: downloads/
          if-no-files-found: warn
          retention-days: 7
