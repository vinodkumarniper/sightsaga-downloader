name: One-off protest reel audio
on:
  push:
    branches:
      - reel-audio-20260929
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download approved ElevenLabs audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio
          curl -L --fail --retry 3 -o audio/bunty_voiceover.mp3 'https://storage.googleapis.com/xi-backend/database/workspace/b8d6c7361e7a4cfd924285cd6d01fb56/content_generation/0bNlJrtIAXw7DMWu2fDr/NoQisEQl5xqVyufdESWB/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20260929%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260929T181409Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-'
          curl -L --fail --retry 3 -o audio/sightsaga_music.mp3 'https://storage.googleapis.com/xi-backend/database/workspace/b8d6c7361e7a4cfd924285cd6d01fb56/content_generation/pZ6V5483TS1lcyx1jobN/xWbAZ3rZdwEIrn9uEQUK/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20260929%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260929T181410Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-'
          ls -lh audio
      - name: Upload audio bundle
        uses: actions/upload-artifact@v4
        with:
          name: peaceful-protest-reel-audio
          path: audio/
          retention-days: 2
