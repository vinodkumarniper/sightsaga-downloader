name: ElevenLabs relay upload (one-time keypair)

on:
  push:
    branches: ["assets/starlink-ukraine-2026-10-15"]
    paths: [".github/workflows/el-upload.yml"]

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Publish one-time public key, wait for encrypted payload, relay to ElevenLabs
        run: |
          set +e
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          B=assets/starlink-ukraine-2026-10-15
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/priv.pem 2>/dev/null
          git fetch -q origin $B; git checkout -q -B work FETCH_HEAD
          mkdir -p relay; openssl pkey -in /tmp/priv.pem -pubout -out relay/pub.pem
          git add relay/pub.pem; git commit -qm "relay: one-time public key [skip ci]"; git push -q origin work:$B || echo "push failed"
          ok=0
          for i in $(seq 1 90); do
            sleep 10
            git fetch -q origin $B
            if git cat-file -e FETCH_HEAD:relay/key.enc 2>/dev/null; then ok=1; break; fi
          done
          [ $ok = 1 ] || { echo "no payload"; exit 1; }
          git checkout -q -B work FETCH_HEAD
          openssl pkeyutl -decrypt -inkey /tmp/priv.pem -pkeyopt rsa_padding_mode:oaep -in relay/key.enc -out /tmp/k.txt || echo "rsa fail"
          openssl enc -d -aes-256-cbc -pbkdf2 -in relay/payload.enc -out /tmp/p.tar -pass file:/tmp/k.txt || echo "aes fail"
          mkdir -p /tmp/p && tar xf /tmp/p.tar -C /tmp/p
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X PUT -H "Content-Type: $(cat /tmp/p/mime.txt)" --data-binary @/tmp/p/file.bin "$(cat /tmp/p/url.txt)")
          git rm -q relay/payload.enc relay/key.enc relay/pub.pem
          echo "$code" > relay/status.txt; git add relay/status.txt
          git commit -qm "relay: done, payload removed [skip ci]"; git push -q origin work:$B
          rm -rf /tmp/p /tmp/p.tar /tmp/priv.pem /tmp/k.txt
