name: Starlink Ukraine Commons assets

on:
  push:
    branches: ["assets/starlink-ukraine-2026-10-15"]
    paths:
      - ".github/workflows/starlink-ukraine-commons.yml"
      - "batches/starlink-ukraine-2026-10-15-commons.txt"
      - "scripts/commons_fetch.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch freely licensed images from Wikimedia Commons
        run: python3 scripts/commons_fetch.py batches/starlink-ukraine-2026-10-15-commons.txt downloads
      - name: Commit images to this branch (artifact storage is not reachable from the editing sandbox)
        run: |
          mkdir -p assets/starlink-ukraine
          cp -r downloads/* assets/starlink-ukraine/
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add assets/starlink-ukraine
          git commit -m "Commons images for Starlink Ukraine explainer [skip ci]" || echo "nothing to commit"
          git push
