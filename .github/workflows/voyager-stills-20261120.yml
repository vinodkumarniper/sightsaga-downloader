name: Voyager 1 stills (NASA public domain via Commons)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/voyager-stills-20261120.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch stills
        shell: bash
        run: |
          mkdir -p out && cd out
          curl -fsSL -A "SightSagaArchive/1.0" -o PBD_nasa_1600.jpg https://science.nasa.gov/wp-content/uploads/2023/09/PIA23645_PaleBlueDotRevisited_1600.jpg || echo MISSING pbd
          cat > /tmp/c.py <<'PY'
          import re, time, urllib.request, urllib.parse, json, pathlib
          UA={"User-Agent":"SightSagaArchive/1.0 (contact via github; attribution collection)"}
          log=[]
          def get(url,fn):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=90) as a: data=a.read()
                  open(fn,"wb").write(data); log.append(dict(file=fn,url=url,bytes=len(data)))
              except Exception as e: log.append(dict(file=fn,url=url,error=str(e)))
              time.sleep(4)
          for key,page in {"launch_nasa":"https://science.nasa.gov/photojournal/voyager-1-launch",
                           "pbd_nasa":"https://science.nasa.gov/photojournal/pale-blue-dot-revisited",
                           "v1_mission":"https://science.nasa.gov/mission/voyager/voyager-1/"}.items():
              try:
                  html=urllib.request.urlopen(urllib.request.Request(page,headers=UA),timeout=60).read().decode("utf8","ignore")
                  m=re.search(r'property="og:image" content="([^"]+)"',html)
                  imgs=list(dict.fromkeys(re.findall(r'https://science\.nasa\.gov/wp-content/uploads/[^"\s?]+\.(?:jpg|jpeg|png)',html)))
                  log.append(dict(page=page,og=m.group(1) if m else None,imgs=imgs[:12]))
                  if m: get(m.group(1).split("?")[0],key+".jpg")
                  for i,u in enumerate(imgs[:4]): get(u,f"{key}_{i}."+u.rsplit(".",1)[-1])
              except Exception as e: log.append(dict(page=page,error=str(e)))
              time.sleep(4)
          for name in ["PIA23645-Earth-PaleBlueDot-6Bkm-Voyager1-orig19900214-upd20200212.jpg","Great Red Spot From Voyager 1.jpg",
                       "Jupiter and its shrunken Great Red Spot.jpg","Saturn from Voyager 1.jpg","Voyager 1 launch.jpg","Titan 3E Centaur launches Voyager 1.jpg",
                       "The Sounds of Earth Record Cover - GPN-2000-001978.jpg"]:
              get("https://commons.wikimedia.org/wiki/Special:FilePath/"+urllib.parse.quote(name)+"?width=2000","commons_"+re.sub(r"[^A-Za-z0-9]+","_",name)[:50]+".jpg")
          pathlib.Path("stills_log.json").write_text(json.dumps(log,indent=1))
          PY
          python3 /tmp/c.py || true; ls -la
      - name: Commit
        shell: bash
        run: |
          set -eu; cd out; git init -q
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -qm "Voyager stills [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/assets/voyager-stills-2026-11-20
