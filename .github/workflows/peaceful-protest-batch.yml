name: Peaceful protest footage batch

on:
  push:
    paths:
      - ".github/workflows/peaceful-protest-batch.yml"
      - "batches/peaceful-protest-guide-2026-09-29.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install package
        run: python -m pip install .

      - name: Download selected public footage
        run: |
          sightsaga-download \
            --url-file batches/peaceful-protest-guide-2026-09-29.txt \
            --output-dir downloads \
            --max-downloads 25

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peaceful-protest-footage-${{ github.run_number }}
          path: downloads/
          if-no-files-found: warn
          retention-days: 7
