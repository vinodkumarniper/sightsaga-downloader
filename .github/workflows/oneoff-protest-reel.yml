name: One-off protest reel footage

on:
  push:
    branches:
      - reel-footage-20260929

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download selected public footage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p footage
          curl -L --fail --retry 3 -o footage/01_phone_passcode.mp4 "https://videos.pexels.com/video-files/6611949/6611949-uhd_2160_3840_25fps.mp4"
          curl -L --fail --retry 3 -o footage/02_buddy_map.mp4 "https://videos.pexels.com/video-files/4873827/4873827-uhd_3840_2160_25fps.mp4"
          curl -L --fail --retry 3 -o footage/03_delhi_barricade.mp4 "https://videos.pexels.com/video-files/16668725/16668725-uhd_3840_2160_24fps.mp4"
          curl -L --fail --retry 3 -o footage/04_offline_map.mp4 "https://videos.pexels.com/video-files/4546853/4546853-hd_1080_1920_25fps.mp4"
          curl -L --fail --retry 3 -o footage/05_recording_phone.mp4 "https://videos.pexels.com/video-files/8115521/8115521-uhd_2160_3840_24fps.mp4"
          curl -L --fail --retry 3 -o footage/06_lawyer.mp4 "https://videos.pexels.com/video-files/8061600/8061600-uhd_3840_2160_25fps.mp4"
          curl -L --fail --retry 3 -o footage/07_hongkong_archive.webm "https://upload.wikimedia.org/wikipedia/commons/7/7d/Hong_Kong_Protestors_Deliver_Supplies_on_Human_Assembly_Line.webm"
          ls -lh footage
      - name: Upload footage bundle
        uses: actions/upload-artifact@v4
        with:
          name: peaceful-protest-reel-footage
          path: footage/
          retention-days: 2
